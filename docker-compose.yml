version: '3.8'

services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: analyst
      POSTGRES_PASSWORD: password
      POSTGRES_DB: footballiq
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
  
  redis:
    image: redis:7
    ports:
      - "6379:6379"
  
  api:
    build: ./backend
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    depends_on:
      - postgres
      - redis
    environment:
      DATABASE_URL: postgresql://analyst:password@postgres:5432/footballiq
      REDIS_URL: redis://redis:6379/0
  
  frontend:
    build: ./frontend
    command: npm run dev
    volumes:
      - ./frontend:/app
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  postgres_data:
